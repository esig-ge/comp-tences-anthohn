{% load static tailwind_tags %}
<!DOCTYPE html>
<html>
    <head>
        <title>YouTube</title>
        {% tailwind_css %}
    </head>
    <body>
        <header class="bg-white shadow-sm">
            <div class="mx-auto px-4 max-w-5xl py-4 flex items-center">
                {% if user.is_authenticated %}
                    <a href="{% url 'video_new' %}" class="mr-4 inline-block">
                        {% include './icons/file-earmark-plus.svg' %}
                    </a>
                {% endif %}
                <h1 class="text-2xl font-semibold"><a href="/">YouTube</a></h1>
            </div>
        </header>
        <main class="content mx-auto px-4 max-w-4xl py-6">
            <div>
                <div>
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </main>
    </body>
</html>

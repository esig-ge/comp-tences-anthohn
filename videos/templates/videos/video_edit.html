{% extends 'videos/base.html' %}

{% block content %}
<div class="edit-video-container">
    <h2 class="page-title">Vidéo</h2>
    <!-- Ici pas besoin de spécifier l'attribut "action" de la balise form, car par défaut le formulaire sera
    soumis à la même URL que celle de la page actuelle. -->
    <!-- Comme il n'y a pas d'action="...", le navigateur comprend : "Renvoie ces données à l'adresse où je suis actuellement". -->
    <form method="POST" enctype="multipart/form-data" class="video-form">
        {% csrf_token %}
        {% comment %} ici as_p sert à rendre le formulaire sous forme de paragraphes {% endcomment %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-save">Sauvegarder</button>
        </div>
    </form>
</div>
{% endblock %}

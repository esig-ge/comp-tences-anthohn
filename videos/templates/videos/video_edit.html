{% extends 'videos/base.html' %}

{% block content %}
    <h2>New video</h2>
    {% comment %} Ici pas besoin de spécifier l'attribut "action" de la balise form, car par défaut le formulaire sera soumis à la même URL que celle de la page actuelle. {% endcomment %}
    <form method="POST" class="video-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="save btn btn-default">Save</button>
    </form>
{% endblock %}

{% extends 'videos/base.html' %}

{% block content %}
    <main class="mx-auto max-w-5xl px-4">
        <div class="grid grid-cols-4 gap-6">
            {% for video in videos %}
                <a class="border rounded-lg p-4 shadow-sm bg-white" href="{% url 'video_detail' pk=video.pk %}">
                    <img src="{{ video.thumbnail.url }}"  alt="Thumbnail for {{ video.title }}" class="mt-3 rounded-md shadow-sm w-full object-cover">
                    <h2 class="mt-2 text-xl font-semibold">{{ video.title }}</h2>
                    <div class="date text-sm text-gray-500">{{ video.uploaded_at }}</div>
                </a>
            {% endfor %}
        </div>
    </main>
{% endblock %}
